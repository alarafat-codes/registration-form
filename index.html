<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form tag</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Registrattion Form</h1>
    <form action="">
      <label for="">Roll no:</label>
      <input type="text" /> <br /><br />
      <label for="">Student name :</label>
      <input type="text" name="First name" placeholder="First name" />
      <input
        type="text"
        name="Last name "
        placeholder="Last name"
      /><br /><br />
      <label for="">Fathers name :</label>
      <input type="text" /><br /><br />
      <label for="">Date of birth :</label>
      <input type="date" /><br /><br />

      <label for="">Mobile no:</label>
      <label for="">+880</label>
      <input type="number" /> <br /><br />
      <label for="">Email id:</label>
      <input type="email" /><br /><br />
      <label for="">Password:</label>
      <input type="password" /> <br /><br />
      <label for="">Gender:</label>
      <input type="radio" name="manus" value="Male" />Male
      <input type="radio" name="manus" value="Female" />Female <br /><br />
      <label for="">Depertment:</label>
      <input type="radio" />CSE <input type="radio" />IT
      <input type="radio" />ECE <input type="radio" />CIVIL
      <input type="radio" />MECH <br /><br />
      <label for="">Course:</label>
      <input type="text" placeholder="Select current course." /> <br /><br />
      <label for="">Student photo:</label>
      <input type="file" /> <br /><br />
      <label for="">City:</label>
      <input type="text" />
      <br /><br />
      <label for="">Address:</label>
      <input type="text" />
      <br /><br />
      <button>Register</button>
    </form>
  </body>
</html>
